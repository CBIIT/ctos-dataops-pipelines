# Prefect deployment for INS OpenSearch backup.
#
# Required Prefect variables:
#   ins_secret_name_dev
#     AWS Secrets Manager secret name containing es_host.
#   ins_opensearch_backup_bucket
#     S3 bucket used by the OpenSearch snapshot repository.
#   ins_opensearch_snapshot_role
#     IAM role name supplied when registering the S3 repository.
#   ins_opensearch_repo
#     OpenSearch snapshot repository name.

name: INS Data Backup and Restore
prefect-version: null
data_model_repo_url: https://github.com/CBIIT/ins-model

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/CBIIT/ctos-dataops-pipelines.git
      branch: ins-pipelines
      include_submodules: true
  - prefect.deployments.steps.pip_install_requirements:
      requirements_file: requirements.txt
      directory: "{{ clone-step.directory }}"
      stream_output: false

deployments:
  - name: ins-opensearch-backup
    version: null
    tags: []
    description: Create an OpenSearch snapshot.
    schedule: {}
    flow_name: null
    entrypoint: opensearch_backup_universal_prefect.py:opensearch_backup_prefect
    parameters:
      snapshot_name: ""
      secret_name_prefect_variable: ins_secret_name_dev
      aws_role_prefect_variable: ins_opensearch_snapshot_role
      opensearch_repo: "{{ prefect.variables.ins_opensearch_repo }}"
      s3_bucket: "{{ prefect.variables.ins_opensearch_backup_bucket }}"
      indices: ""
    work_pool:
      name: ccdi-ins-2gb-prefect-3.2.14-python3.9
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "OpenSearch Backup"

  - name: ins-opensearch-restore
    version: null
    tags: []
    description: Replace selected OpenSearch indexes from an S3 snapshot.
    schedule: {}
    flow_name: null
    entrypoint: opensearch_restore_universal_prefect.py:opensearch_restore_prefect
    parameters:
      snapshot_name: ""
      secret_name_prefect_variable: ins_secret_name_dev
      aws_role_prefect_variable: ins_opensearch_snapshot_role
      opensearch_repo: "{{ prefect.variables.ins_opensearch_repo }}"
      s3_bucket: "{{ prefect.variables.ins_opensearch_backup_bucket }}"
      indices: ""
    work_pool:
      name: ccdi-ins-2gb-prefect-3.2.14-python3.9
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "OpenSearch Restore"


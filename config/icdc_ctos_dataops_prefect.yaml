    version: null
    tags: []
    description: null
    schedule: {}
    flow_name: null
    entrypoint: opensearch_backup_prefect.py:opensearch_backup_prefect
    parameters:
      environment: "icdc_dev"
      snapshot_name: ""
      s3_bucket: "crdc-nonprod-icdc-opensearch-snapshot-bucket"
      indices: ""
    work_pool:
      name: crdc-curation-16gb-prefect-3.2.14-python3.9
      work_queue_name: default
      job_variables:

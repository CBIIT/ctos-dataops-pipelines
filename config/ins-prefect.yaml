# Prefect deployments for INS Neo4j and OpenSearch backup and restore.
#
# Required Prefect variables:
#   ins_secret_name_dev
#     AWS Secrets Manager secret name containing neo4j_ip, neo4j_user,
#     neo4j_password, and es_host.
#   ins_neo4j_ssh_secret_name
#     AWS Secrets Manager secret name containing neo4j_prefect_user and
#     neo4j_key.
#   ins_dataops_backup_bucket
#     S3 bucket used for Neo4j dumps.
#   ins_opensearch_backup_bucket
#     S3 bucket used by the OpenSearch snapshot repository.
#   ins_opensearch_snapshot_role
#     IAM role name supplied when registering the S3 repository.
#   ins_opensearch_repo
#     OpenSearch snapshot repository name.

name: INS Data Backup and Restore
prefect-version: null
data_model_repo_url: https://github.com/CBIIT/ins-model

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/CBIIT/ctos-dataops-pipelines.git
      branch: ins-pipelines
      include_submodules: true
  - prefect.deployments.steps.pip_install_requirements:
      requirements_file: requirements.txt
      directory: "{{ clone-step.directory }}"
      stream_output: false

deployments:
  - name: ins-neo4j-backup
    version: null
    tags: []
    description: Create a Neo4j summary, archive its data model, and upload a database dump to S3.
    schedule: {}
    flow_name: null
    entrypoint: data_asset_generation_prefect.py:data_asset_generation_prefect
    parameters:
      environment: dev
      s3_folder: dump_files
      s3_bucket: "{{ prefect.variables.ins_dataops_backup_bucket }}"
    work_pool:
      name: ccdi-dcc-8gb-prefect-3.4.19-python3.13
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "Neo4j Summary Generator,Data Model Archiving,Neo4j Dump Generator,S3 Bucket,Bento Config"

  - name: ins-neo4j-restore
    version: null
    tags: []
    description: Replace Neo4j with a dump previously uploaded to S3.
    schedule: {}
    flow_name: null
    entrypoint: data_asset_loading_prefect.py:data_asset_loading_prefect
    parameters:
      environment: dev
      s3_folder: dump_files
      dump_file_name: neo4j_dump.dump
      validation_summary_file_name: neo4j_summary.json
      restore_summary_file_name: neo4j_restore_summary.json
      s3_bucket: "{{ prefect.variables.ins_dataops_backup_bucket }}"
    work_pool:
      name: ccdi-dcc-8gb-prefect-3.4.19-python3.13
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "Neo4j Summary Generator,Neo4j Data Asset Loading,Neo4j Restore,S3 Bucket,Bento Config"

  - name: ins-opensearch-backup
    version: null
    tags: []
    description: Create an OpenSearch snapshot.
    schedule: {}
    flow_name: null
    entrypoint: opensearch_backup_universal_prefect.py:opensearch_backup_prefect
    parameters:
      snapshot_name: ""
      secret_name_prefect_variable: ins_secret_name_dev
      aws_role_prefect_variable: ins_opensearch_snapshot_role
      opensearch_repo: "{{ prefect.variables.ins_opensearch_repo }}"
      s3_bucket: "{{ prefect.variables.ins_opensearch_backup_bucket }}"
      indices: ""
    work_pool:
      name: ccdi-dcc-8gb-prefect-3.4.19-python3.13
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "OpenSearch Backup"

  - name: ins-opensearch-restore
    version: null
    tags: []
    description: Replace selected OpenSearch indexes from an S3 snapshot.
    schedule: {}
    flow_name: null
    entrypoint: opensearch_restore_universal_prefect.py:opensearch_restore_prefect
    parameters:
      snapshot_name: ""
      secret_name_prefect_variable: ins_secret_name_dev
      aws_role_prefect_variable: ins_opensearch_snapshot_role
      opensearch_repo: "{{ prefect.variables.ins_opensearch_repo }}"
      s3_bucket: "{{ prefect.variables.ins_opensearch_backup_bucket }}"
      indices: ""
    work_pool:
      name: ccdi-dcc-8gb-prefect-3.4.19-python3.13
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "OpenSearch Restore"

# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: CTOS DATAOPS
prefect-version: null

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/CBIIT/ctos-dataops-pipelines.git
      branch: integrated-dashboard-pipeline
      include_submodules: True
  - prefect.deployments.steps.pip_install_requirements:
      requirements_file: requirements.txt
      directory: "{{ clone-step.directory }}"
      stream_output: False

deployments:
  
  - name: integrated-opensearch-backup
    version: null
    tags: []
    description: null
    schedule: {}
    flow_name: null
    entrypoint:  opensearch_backup_universal_prefect.py:opensearch_backup_prefect
    parameters:
      snapshot_name: ""
      secret_name_prefect_variable: ""
      aws_role_prefect_variable: ""
      opensearch_repo: "{{ prefect.variables.gc_opensearch_repo }}"
      s3_bucket: "{{ prefect.variables.gc_opensearch_backup_bucket }}"
      indices: ""
    work_pool:
      name: ccdi-c3dc-16gb-prefect-3.2.14-python3.9
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "OpenSearch Backup"
  
  - name: integrated-opensearch-restore
    version: null
    tags: []
    description: null
    schedule: {}
    flow_name: null
    entrypoint:  opensearch_restore_universal_prefect.py:opensearch_restore_prefect
    parameters:
      snapshot_name: ""
      secret_name_prefect_variable: ""
      aws_role_prefect_variable: ""
      opensearch_repo: "{{ prefect.variables.gc_opensearch_repo }}"
      s3_bucket: "{{ prefect.variables.gc_opensearch_backup_bucket }}"
      indices: ""
    work_pool:
      name: ccdi-c3dc-16gb-prefect-3.2.14-python3.9
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "OpenSearch Restore"

  - name: integrated-opensearch-promote
    version: null
    tags: []
    description: Promote (restore) an OpenSearch snapshot to stage or production environment
    schedule: {}
    flow_name: null
    entrypoint: opensearch_restore_universal_prefect.py:opensearch_restore_prefect
    parameters:
      snapshot_name: ""
      secret_name_prefect_variable: ""
      aws_role_prefect_variable: ""
      opensearch_repo: "{{ prefect.variables.gc_opensearch_repo }}"
      s3_bucket: "{{ prefect.variables.gc_opensearch_backup_bucket }}"
      indices: ""
    work_pool:
      name: ccdi-dcc-prod-16gb-prefect-3.4.19-python3.13
      work_queue_name: default
      job_variables:
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: "OpenSearch Restore"